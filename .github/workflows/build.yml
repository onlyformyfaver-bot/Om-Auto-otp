name: Build OM SMS OTP APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project
        run: |
          for z in $(ls *.zip 2>/dev/null); do unzip -o "$z"; done
      - name: Find the gradle project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then echo "No Gradle project found"; ls -R; exit 1; fi
          echo "dir=$(dirname "$f")" >> "$GITHUB_OUTPUT"
          echo "Found project in: $(dirname "$f")"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: OM-SMS-OTP-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
