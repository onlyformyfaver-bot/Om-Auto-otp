<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send OTP to Admin</title>
<style>
  :root{ --bg:#fff; --ink:#111; --muted:#555; --brand:#e65100; --ok:#1b7f3a; --err:#c62828; --line:#d9d4cb; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141210; --ink:#f5f1ea; --muted:#b4aca1; --brand:#ff9800; --ok:#4caf72; --err:#ef5350; --line:#34302a; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; justify-content:center;
    padding:calc(20px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));
    max-width:520px; margin:0 auto;
  }
  h1{ font-size:28px; line-height:1.3; margin:0 0 20px; font-weight:800; }
  h1 .hi{ color:var(--brand); }
  .step{ font-size:20px; color:var(--muted); margin:0 0 10px; line-height:1.6; }
  input#otp{
    width:100%; padding:22px 10px; margin-top:6px;
    font-size:48px; letter-spacing:.3em; text-align:center; font-weight:800;
    font-family:ui-monospace,monospace;
    border:3px solid var(--line); border-radius:16px; background:transparent; color:var(--ink);
  }
  input#otp:focus{ outline:none; border-color:var(--brand); }
  .btn{
    width:100%; margin-top:20px; padding:26px; font-size:26px; font-weight:800;
    border:none; border-radius:18px; color:#fff; background:var(--brand); cursor:pointer;
  }
  .btn:active{ transform:scale(.99); }
  .btn:disabled{ opacity:.5; }
  .status{ margin-top:20px; text-align:center; font-weight:800; font-size:24px; min-height:30px; }
  .status.ok{ color:var(--ok); } .status.err{ color:var(--err); }
</style>
</head>
<body>
  <h1 id="title">Namaste</h1>
  <p class="step"><b>1.</b> Tap the box below.<br><b>2.</b> Tap the <b>code that pops up</b> on your keyboard.<br><b>3.</b> Tap the big orange button.</p>

  <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
         pattern="[0-9]*" maxlength="8" placeholder="------" autofocus>

  <button class="btn" id="send">SEND OTP</button>

  <div class="status" id="status"></div>

<script>
/* ======================================================================
   Your Cloudflare Worker address. Nothing secret is stored here.
   ====================================================================== */
const RELAY_URL = "https://om-otp-relay.onlyformyfaver.workers.dev";
/* ====================================================================== */

const $ = id => document.getElementById(id);

const who = new URLSearchParams(location.search).get("name");
$("title").innerHTML = who ? ("Namaste, <span class='hi'>" + who.replace(/[<>]/g,"") + "</span>") : "Namaste";

window.addEventListener("load", () => { try{ $("otp").focus(); }catch(e){} });

function getOtp(){ return ($("otp").value || "").replace(/\D/g,""); }
function setStatus(msg, kind){ const s=$("status"); s.textContent=msg; s.className="status"+(kind?" "+kind:""); }

$("send").addEventListener("click", async () => {
  const otp = getOtp();
  if (otp.length < 4){ setStatus("Please enter the code", "err"); $("otp").focus(); return; }
  setStatus("Sending...");
  $("send").disabled = true;
  try{
    const res = await fetch(RELAY_URL, {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ otp: otp, name: who || "Helper" })
    });
    const data = await res.json();
    if (data.ok){ setStatus("Sent. Thank you!", "ok"); }
    else { setStatus("Failed. Please tell admin.", "err"); }
  }catch(e){ setStatus("No internet. Try again.", "err"); }
  finally{ $("send").disabled = false; }
});
</script>
</body>
</html>
